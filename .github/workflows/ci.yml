name: Rust CI & PGO Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  check_and_clippy:
    name: Lint, Invariants & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 + clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace invariants
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== Verifying workspace invariants (<= 400 lines, #![forbid(unsafe_code)], zero unsafe) ==="
            while IFS= read -r -d '' file; do
              lines="$(wc -l < "${file}")"
              if [ "${lines}" -gt 400 ]; then
                echo "ERROR: ${file} has ${lines} lines (exceeds 400-line limit)"
                exit 1
              fi
            done < <(find crates -name '*.rs' -print0)

            for root_file in crates/*/src/lib.rs crates/*/src/main.rs; do
              if [ -f "${root_file}" ] && ! grep -q '#!\[forbid(unsafe_code)\]' "${root_file}"; then
                echo "ERROR: Crate root ${root_file} is missing #![forbid(unsafe_code)]"
                exit 1
              fi
            done

            if grep -rn 'unsafe ' crates/ --include='*.rs'; then
              echo "ERROR: Forbidden 'unsafe ' token detected under crates/"
              exit 1
            fi
          } 2>&1 | tee /tmp/ci-lint.log

      - name: Cargo check (-D warnings)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets 2>&1 | tee /tmp/ci-lint.log

      - name: Cargo clippy (-D warnings)
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/ci-lint.log

      - name: Report failure log to GitHub Issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOG_TAIL="$(tail -c 45000 /tmp/ci-lint.log 2>/dev/null || echo 'No log captured.')"
          {
            echo "### CI Failed: \`Lint, Invariants & Clippy\`"
            echo ""
            echo "- **Commit:** \`${SHORT_SHA}\`"
            echo "- **Run:** ${RUN_URL}"
            echo ""
            echo '```text'
            echo "${LOG_TAIL}"
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CI Failed: Lint & Clippy (${SHORT_SHA:0:7})" \
            --body-file /tmp/issue-body.md

  workspace_tests:
    name: Workspace & Doc Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets -- --nocapture 2>&1 | tee /tmp/ci-test.log

      - name: Run doc tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --doc 2>&1 | tee /tmp/ci-test.log

      - name: Report failure log to GitHub Issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOG_TAIL="$(tail -c 45000 /tmp/ci-test.log 2>/dev/null || echo 'No log captured.')"
          {
            echo "### CI Failed: \`Workspace & Doc Tests\`"
            echo ""
            echo "- **Commit:** \`${SHORT_SHA}\`"
            echo "- **Run:** ${RUN_URL}"
            echo ""
            echo '```text'
            echo "${LOG_TAIL}"
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CI Failed: Workspace Tests (${SHORT_SHA:0:7})" \
            --body-file /tmp/issue-body.md

  pgo_release_linux:
    name: PGO Release Build (Linux)
    needs: [workspace_tests]
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 + llvm-tools-preview
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build PGO-optimized Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          {
            HOST_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
            SYSROOT="$(rustc --print sysroot)"
            LLVM_PROFDATA="${SYSROOT}/lib/rustlib/${HOST_TRIPLE}/bin/llvm-profdata"
            PGO_DIR="${GITHUB_WORKSPACE}/pgo-profiles-linux"
            mkdir -p "${PGO_DIR}"

            RUSTFLAGS="-Cprofile-generate=${PGO_DIR}" cargo build --release -p nro-server -p nro-db --target "${HOST_TRIPLE}"
            "./target/${HOST_TRIPLE}/release/nro-server" --benchmark-replay --replay-scale 2500
            "${LLVM_PROFDATA}" merge -o "${PGO_DIR}/merged.profdata" "${PGO_DIR}"

            RUSTFLAGS="-Cprofile-use=${PGO_DIR}/merged.profdata -Cllvm-args=-pgo-warn-missing-function" cargo build --release -p nro-server -p nro-db --target "${HOST_TRIPLE}"
            "./target/${HOST_TRIPLE}/release/nro-server" --benchmark-replay --replay-scale 1000

            cp "./target/${HOST_TRIPLE}/release/nro-server" ./nro-server
            cp "./target/${HOST_TRIPLE}/release/nro-import-sql" ./nro-import-sql
          } 2>&1 | tee /tmp/ci-pgo-linux.log

      - name: Upload Linux PGO release binaries
        uses: actions/upload-artifact@v4
        with:
          name: nro-server-linux-${{ github.sha }}
          retention-days: 14
          path: |
            nro-server
            nro-import-sql

      - name: Report failure log to GitHub Issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOG_TAIL="$(tail -c 45000 /tmp/ci-pgo-linux.log 2>/dev/null || echo 'No log captured.')"
          {
            echo "### CI Failed: \`PGO Release Build (Linux)\`"
            echo ""
            echo "- **Commit:** \`${SHORT_SHA}\`"
            echo "- **Run:** ${RUN_URL}"
            echo ""
            echo '```text'
            echo "${LOG_TAIL}"
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CI Failed: PGO Linux (${SHORT_SHA:0:7})" \
            --body-file /tmp/issue-body.md

  pgo_release_windows:
    name: PGO Release Build (Windows)
    needs: [workspace_tests]
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 + llvm-tools-preview
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build PGO-optimized Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logFile = Join-Path $env:RUNNER_TEMP "ci-pgo-windows.log"
          try {
            $hostTriple = ((rustc -vV) | Select-String '^host: ').ToString().Split(' ')[1].Trim()
            $sysroot = (rustc --print sysroot).Trim()
            $llvmProfdata = Join-Path $sysroot "lib\rustlib\$hostTriple\bin\llvm-profdata.exe"
            $pgoDir = Join-Path $env:GITHUB_WORKSPACE "pgo-profiles-win"
            New-Item -ItemType Directory -Force -Path $pgoDir | Out-Null

            $env:RUSTFLAGS = "-Cprofile-generate=$pgoDir"
            cargo build --release -p nro-server -p nro-db --target $hostTriple 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & ".\target\$hostTriple\release\nro-server.exe" --benchmark-replay --replay-scale 2500 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $llvmProfdata merge -o "$pgoDir\merged.profdata" $pgoDir 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $env:RUSTFLAGS = "-Cprofile-use=$pgoDir\merged.profdata -Cllvm-args=-pgo-warn-missing-function"
            cargo build --release -p nro-server -p nro-db --target $hostTriple 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & ".\target\$hostTriple\release\nro-server.exe" --benchmark-replay --replay-scale 1000 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Copy-Item ".\target\$hostTriple\release\nro-server.exe" ".\nro-server.exe" -Force
            Copy-Item ".\target\$hostTriple\release\nro-import-sql.exe" ".\nro-import-sql.exe" -Force
          } catch {
            $_ | Out-String | Tee-Object -FilePath $logFile -Append
            throw
          }

      - name: Upload Windows PGO release binaries
        uses: actions/upload-artifact@v4
        with:
          name: nro-server-windows-${{ github.sha }}
          retention-days: 14
          path: |
            nro-server.exe
            nro-import-sql.exe

      - name: Report failure log to GitHub Issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP "ci-pgo-windows.log"
          $logText = if (Test-Path $logFile) { Get-Content -Raw $logFile } else { "No log captured." }
          if ($logText.Length -gt 45000) { $logText = $logText.Substring($logText.Length - 45000) }
          $short = $env:SHORT_SHA.Substring(0, 7)
          $bodyPath = Join-Path $env:RUNNER_TEMP "issue-body.md"
          @"
          ### CI Failed: ``PGO Release Build (Windows)``

          - **Commit:** ``$($env:SHORT_SHA)``
          - **Run:** $($env:RUN_URL)

          ``````text
          $logText
          ``````
          "@ | Set-Content -Path $bodyPath -Encoding utf8
          gh issue create `
            --repo $env:GITHUB_REPOSITORY `
            --title "CI Failed: PGO Windows ($short)" `
            --body-file $bodyPath
